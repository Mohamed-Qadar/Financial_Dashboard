[project]
name = "somali-erp-backend"
version = "0.1.0"
description = "Somali ERP backend (Django + Django REST Framework)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "S",            # bandit (security)
    "SIM",          # simplify
    "RUF",          # ruff-specific
]
# Django/DRF declare configuration as mutable class attributes (Meta.constraints, permission_classes).
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S603"]
# Builds DCL statements from settings.DATABASE_APP_ROLE, which settings validate as a plain identifier.
"apps/core/db_roles.py" = ["S608"]
